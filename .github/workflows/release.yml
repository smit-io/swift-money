name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  test:
    name: Test Before Release
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4

    - name: Run Tests
      run: swift test -v

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
